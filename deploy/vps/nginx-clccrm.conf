########################################################################
# CLC CRM — Nginx site (bare IP, HTTP only)
# Installed to /etc/nginx/sites-available/clccrm by setup.sh, which
# substitutes __APP_DIR__ with the real path (default /var/www/clccrm).
########################################################################

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Built React app (vite build output)
    root __APP_DIR__/frontend/dist;
    index index.html;

    # xlsx lead imports / creative uploads go through here
    client_max_body_size 25m;

    # ---- API + auth + core routes -> Node backend ---------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Uploaded files + OAuth callbacks + hosted lead form ---------
    location /public/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- PDF downloads ---------------------------------------------------
    location /download/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Socket.io (frontend currently polls, but keep this working) --
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- Hashed static assets: cache hard, 404 if missing ------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
