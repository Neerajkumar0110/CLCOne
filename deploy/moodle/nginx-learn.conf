# Moodle vhost — learn.<domain>, co-located on the CRM VPS.
# setup.sh substitutes __DOMAIN__, __MOODLE_DIR__ and __PHP_SOCK__.
# certbot --nginx adds the 443 server block + http->https redirect on first run.
#
# NAME-BASED vhost (no default_server) — the existing CRM vhost keeps
# `listen 80 default_server`, so this only answers to __DOMAIN__.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __MOODLE_DIR__;
    index index.php;

    # Moodle wants a generous body size for course/file uploads.
    client_max_body_size 200M;

    # Deny the paths Moodle says must never be web-served.
    location ~ ^/(\.git|config\.php|\.env) { deny all; }
    location ~ ^/(vendor|node_modules|lib/editor/tinymce/plugins/.*/node_modules)/ { deny all; }
    location /dataroot/ { internal; alias /var/moodledata/; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass unix:__PHP_SOCK__;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Long-cache Moodle's revved static assets.
    location ~* /theme/.*\.(js|css|png|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    access_log /var/log/nginx/moodle.access.log;
    error_log  /var/log/nginx/moodle.error.log;
}
