# Moodle vhost — PILOT / INTERNAL TEST ONLY.
# Binds to 127.0.0.1:8081 — NOT reachable from the internet. Access it from
# your laptop over an SSH tunnel:
#     ssh -L 8081:127.0.0.1:8081 root@200.141.5.195
# then open http://localhost:8081  (Moodle $CFG->wwwroot must match exactly).
#
# This block cannot collide with the CRM vhost: different listen address:port.
# The CRM keeps `listen 80 default_server` untouched.
# setup.sh (PILOT=1) substitutes __MOODLE_DIR__ and __PHP_SOCK__.

server {
    listen 127.0.0.1:8081;
    server_name localhost;

    root __MOODLE_DIR__;
    index index.php;

    client_max_body_size 200M;

    location ~ ^/(\.git|config\.php|\.env) { deny all; }
    location ~ ^/(vendor|node_modules)/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass unix:__PHP_SOCK__;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    access_log /var/log/nginx/moodle-pilot.access.log;
    error_log  /var/log/nginx/moodle-pilot.error.log;
}
